<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #fafafa;
    --border: #e0e0e0;
    --text: #111111;
    --text-dim: #6b6b6b;
    --text-faint: #a3a3a3;
    --on-accent: #ffffff;
    --accent-hover: #333333;
  }

  html[data-theme="dark"] {
    --bg: #101010;
    --surface: #1a1a1a;
    --border: #2e2e2e;
    --text: #f2f2f2;
    --text-dim: #9a9a9a;
    --text-faint: #5c5c5c;
    --on-accent: #101010;
    --accent-hover: #d4d4d4;
  }

  html, body { transition: background 0.25s ease; }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
  }

  .card {
    width: 100%;
    max-width: 360px;
  }

  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  p.sub {
    font-size: 14px;
    color: var(--text-dim);
    margin: 0 0 24px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  /* --- mode switch --- */
  .mode-switch {
    position: relative;
    display: flex;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 3px;
    margin-bottom: 24px;
    height: 40px;
  }

  .mode-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: calc(50% - 3px);
    height: calc(100% - 6px);
    background: var(--text);
    transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform;
  }

  .mode-switch[data-mode="email"] .mode-thumb {
    transform: translateX(100%);
  }

  .mode-option {
    position: relative;
    z-index: 1;
    flex: 1;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: color 0.25s ease;
  }

  .mode-option.active { color: var(--on-accent); }

  .mode-option svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mode-option.active svg { transform: scale(1.1); }

  @media (prefers-reduced-motion: reduce) {
    .mode-thumb, .mode-option svg { transition: none; }
  }

  input[type="email"], input[type="tel"] {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    font-family: inherit;
  }

  input[type="email"]:focus, input[type="tel"]:focus { border-color: var(--text); }

  .contact-field { display: none; }
  .contact-field.active { display: block; }

  button.primary {
    width: 100%;
    background: var(--text);
    color: var(--on-accent);
    border: none;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 500;
    margin-top: 16px;
    cursor: pointer;
    font-family: inherit;
  }

  button.primary:disabled { background: var(--text-faint); cursor: default; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }

  .code-row { display: flex; gap: 8px; margin-bottom: 20px; }

  .code-row input {
    width: 100%;
    aspect-ratio: 1 / 1;
    text-align: center;
    font-size: 19px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-family: inherit;
  }

  .code-row input:focus { border-color: var(--text); }

  .row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }

  .link-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
  }

  .link-btn:disabled { color: var(--text-faint); text-decoration: none; cursor: default; }

  .status { font-size: 13px; margin-top: 14px; min-height: 18px; color: var(--text-dim); }
  .status.error { color: var(--text); font-weight: 500; }
  .status.success { color: var(--text); font-weight: 500; }

  .screen { display: none; }
  .screen.active { display: block; }

  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }

  /* --- theme toggle --- */
  .theme-toggle {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 40;
    padding: 0;
  }

  .theme-toggle svg {
    width: 16px;
    height: 16px;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
  }

  .theme-toggle .icon-moon { position: absolute; transform: rotate(-90deg) scale(0); opacity: 0; }
  .theme-toggle .icon-sun { transform: rotate(0deg) scale(1); opacity: 1; }

  html[data-theme="dark"] .theme-toggle .icon-sun { transform: rotate(90deg) scale(0); opacity: 0; }
  html[data-theme="dark"] .theme-toggle .icon-moon { transform: rotate(0deg) scale(1); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .theme-toggle svg { transition: none; }
  }

  /* --- simulated incoming notification --- */
  .sim-toast {
    position: fixed;
    top: 10px;
    left: 50%;
    width: min(340px, calc(100% - 36px));
    background: #1a1a1a;
    color: #ffffff;
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    box-shadow: 0 12px 28px -8px rgba(0,0,0,0.35);
    transform: translate(-50%, -120%);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 50;
    cursor: pointer;
  }

  .sim-toast.show { transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .sim-toast { transition: opacity 0.2s ease; transform: translate(-50%, 0); opacity: 0; }
    .sim-toast.show { opacity: 1; }
  }

  .sim-toast .icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: #ffffff;
    color: #111111;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .sim-toast .icon svg { width: 16px; height: 16px; }

  .sim-toast .body { flex: 1; min-width: 0; }
  .sim-toast .title-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .sim-toast .title-row span.time { color: #a3a3a3; font-weight: 400; }
  .sim-toast .preview { font-size: 13px; color: #d4d4d4; line-height: 1.4; }
  .sim-toast .preview b { color: #ffffff; font-weight: 700; letter-spacing: 0.03em; }
  .sim-toast .caption {
    font-size: 10px;
    color: #7a7a7a;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="sim-toast" id="simToast">
  <div class="icon" id="simToastIcon"></div>
  <div class="body">
    <div class="title-row"><span id="simToastFrom">Messages</span><span class="time" id="simToastTime">now</span></div>
    <div class="preview" id="simToastPreview"></div>
    <div class="caption">Simulated — (CREATED BY SPIDERR)</div>
  </div>
</div>

<div class="card">

  <div class="screen active fade-in" id="screenContact">
    <h1 id="contactTitle">Verify your phone</h1>
    <p class="sub" id="contactSub">We'll text you a 6-digit code.</p>

    <div class="mode-switch" id="modeSwitch" data-mode="phone">
      <div class="mode-thumb"></div>
      <button class="mode-option active" id="modePhoneBtn" data-mode="phone" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Phone
      </button>
      <button class="mode-option" id="modeEmailBtn" data-mode="email" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6zm-2 0-8 5-8-5"/></svg>
        Email
      </button>
    </div>

    <div class="contact-field active" id="fieldPhone">
      <label for="phone">Phone number</label>
      <input type="tel" id="phone" placeholder="+1 123 456 7890" autocomplete="tel">
    </div>
    <div class="contact-field" id="fieldEmail">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <button class="primary" id="sendBtn">Send code</button>
    <div class="status" id="contactStatus"></div>
  </div>

  <div class="screen" id="screenCode">
    <h1>Enter your code</h1>
    <p class="sub" id="sentTo">We sent a code.</p>
    <div class="code-row" id="codeRow">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
    </div>
    <button class="primary" id="verifyBtn">Verify</button>
    <div class="row-between">
      <button class="link-btn" id="resendBtn">Resend code</button>
      <button class="link-btn" id="backBtn">Change contact info</button>
    </div>
    <div class="status" id="codeStatus"></div>
  </div>

</div>

<script>
(function () {
  // --- dark mode, remembered across visits ---
  const THEME_KEY = 'otp-page-theme';
  const themeToggle = document.getElementById('themeToggle');
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
  }
  let savedTheme = 'light';
  try {
    savedTheme = localStorage.getItem(THEME_KEY) || 'light';
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — fall back to light */ }
  applyTheme(savedTheme);
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
  });
})();

(function () {
  const screenContact = document.getElementById('screenContact');
  const screenCode = document.getElementById('screenCode');
  const modeSwitch = document.getElementById('modeSwitch');
  const modePhoneBtn = document.getElementById('modePhoneBtn');
  const modeEmailBtn = document.getElementById('modeEmailBtn');
  const contactTitle = document.getElementById('contactTitle');
  const contactSub = document.getElementById('contactSub');
  const fieldPhone = document.getElementById('fieldPhone');
  const fieldEmail = document.getElementById('fieldEmail');
  const phoneInput = document.getElementById('phone');
  const emailInput = document.getElementById('email');
  const sendBtn = document.getElementById('sendBtn');
  const contactStatus = document.getElementById('contactStatus');
  const sentTo = document.getElementById('sentTo');
  const codeInputs = Array.from(document.querySelectorAll('#codeRow input'));
  const verifyBtn = document.getElementById('verifyBtn');
  const resendBtn = document.getElementById('resendBtn');
  const backBtn = document.getElementById('backBtn');
  const codeStatus = document.getElementById('codeStatus');

  const simToast = document.getElementById('simToast');
  const simToastIcon = document.getElementById('simToastIcon');
  const simToastFrom = document.getElementById('simToastFrom');
  const simToastPreview = document.getElementById('simToastPreview');

  const PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
  const EMAIL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6zm-2 0-8 5-8-5"/></svg>';

  let mode = 'phone'; // 'phone' | 'email'
  let currentContact = "";
  let currentCode = "";
  let currentToken = ""; // only used for the email channel (server-verified)
  let codeExpiresAt = 0;
  let resendCooldown = 0;
  let resendTimer = null;
  let toastHideTimer = null;

  const COPY = {
    phone: { title: 'Verify your phone', sub: "We'll text you a 6-digit code.", placeholder: 'Enter a phone number.' },
    email: { title: 'Verify your email', sub: "We'll email you a 6-digit code.", placeholder: 'Enter an email address.' }
  };

  function setMode(next) {
    if (next === mode) return;
    mode = next;
    modeSwitch.setAttribute('data-mode', mode);
    modePhoneBtn.classList.toggle('active', mode === 'phone');
    modeEmailBtn.classList.toggle('active', mode === 'email');
    fieldPhone.classList.toggle('active', mode === 'phone');
    fieldEmail.classList.toggle('active', mode === 'email');
    contactTitle.textContent = COPY[mode].title;
    contactSub.textContent = COPY[mode].sub;
    setStatus(contactStatus, '', null);
    (mode === 'phone' ? phoneInput : emailInput).focus();
  }

  modePhoneBtn.addEventListener('click', () => setMode('phone'));
  modeEmailBtn.addEventListener('click', () => setMode('email'));

  function showScreen(el) {
    [screenContact, screenCode].forEach(s => s.classList.remove('active', 'fade-in'));
    el.classList.add('active', 'fade-in');
  }

  function setStatus(el, msg, kind) {
    el.textContent = msg;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  function currentInputValue() {
    return (mode === 'phone' ? phoneInput : emailInput).value.trim();
  }

  function generateCode() {
    return Math.floor(100000 + Math.random() * 900000).toString();
  }

  function showSimToast(contact, code) {
    clearTimeout(toastHideTimer);
    simToast.classList.remove('show');
    simToastIcon.innerHTML = mode === 'phone' ? PHONE_ICON : EMAIL_ICON;
    simToastFrom.textContent = mode === 'phone' ? 'Messages' : 'Mail';
    simToastPreview.innerHTML = 'Your verification code is <b>' + code + '</b>. It expires in 5 minutes.';
    requestAnimationFrame(() => {
      simToast.classList.add('show');
    });
    toastHideTimer = setTimeout(() => simToast.classList.remove('show'), 5000);
  }

  simToast.addEventListener('click', () => {
    clearTimeout(toastHideTimer);
    simToast.classList.remove('show');
  });

  async function sendCode(isResend) {
    if (!isResend) {
      const value = currentInputValue();
      if (!value) {
        setStatus(contactStatus, COPY[mode].placeholder, 'error');
        return;
      }
      currentContact = value;
    }

    if (mode === 'phone') {
      // Phone stays fully simulated client-side — no real text sent.
      currentCode = generateCode();
      codeExpiresAt = Date.now() + 5 * 60 * 1000;
      sentTo.textContent = 'We sent a code to ' + currentContact + '.';
      codeInputs.forEach(i => { i.value = ''; i.disabled = false; });
      showScreen(screenCode);
      setStatus(codeStatus, '', null);
      showSimToast(currentContact, currentCode);
      codeInputs[0].focus();
      startResendCooldown();
      return;
    }

    // Email actually sends, via the server (so the sending secret never
    // reaches the browser). The toast is kept as a convenience preview —
    // the server hands back the same code it just emailed so it can still
    // be shown on-page. Drop `code` from the server response if this ever
    // needs to be a real, non-demo verification flow.
    sendBtn.disabled = true;
    resendBtn.disabled = true;
    setStatus(contactStatus, 'Sending...', null);
    setStatus(codeStatus, '', null);
    try {
      const res = await fetch('/api/send-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contact: currentContact })
      });
      const data = await res.json();
      if (!res.ok || !data.token) {
        throw new Error(data.error || 'Could not send code.');
      }
      currentToken = data.token;
      currentCode = data.code; // demo convenience only, see comment above
      if (data.contact) currentContact = data.contact;
      codeExpiresAt = Date.now() + 5 * 60 * 1000;
      sentTo.textContent = 'We sent a code to ' + currentContact + '.';
      codeInputs.forEach(i => { i.value = ''; i.disabled = false; });
      showScreen(screenCode);
      setStatus(codeStatus, '', null);
      showSimToast(currentContact, currentCode);
      codeInputs[0].focus();
      startResendCooldown();
    } catch (err) {
      setStatus(contactStatus, err.message, 'error');
    } finally {
      sendBtn.disabled = false;
    }
  }

  function startResendCooldown() {
    resendCooldown = 15;
    resendBtn.disabled = true;
    updateResendLabel();
    clearInterval(resendTimer);
    resendTimer = setInterval(() => {
      resendCooldown--;
      if (resendCooldown <= 0) {
        clearInterval(resendTimer);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend code';
      } else {
        updateResendLabel();
      }
    }, 1000);
  }

  function updateResendLabel() {
    resendBtn.textContent = 'Resend code (' + resendCooldown + 's)';
  }

  sendBtn.addEventListener('click', () => sendCode(false));
  phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCode(false); });
  emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCode(false); });
  resendBtn.addEventListener('click', () => { if (!resendBtn.disabled) sendCode(true); });
  backBtn.addEventListener('click', () => {
    showScreen(screenContact);
    setStatus(codeStatus, '', null);
  });

  codeInputs.forEach((input, idx) => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^0-9]/g, '').slice(0, 1);
      if (input.value && idx < codeInputs.length - 1) {
        codeInputs[idx + 1].focus();
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && idx > 0) {
        codeInputs[idx - 1].focus();
      }
      if (e.key === 'Enter') verifyCode();
    });
    input.addEventListener('paste', (e) => {
      const text = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '');
      if (text.length === codeInputs.length) {
        e.preventDefault();
        codeInputs.forEach((box, i) => box.value = text[i]);
        verifyBtn.focus();
      }
    });
  });

  async function verifyCode() {
    const entered = codeInputs.map(i => i.value).join('');
    if (entered.length !== 6) {
      setStatus(codeStatus, 'Enter all 6 digits.', 'error');
      return;
    }
    if (Date.now() > codeExpiresAt) {
      setStatus(codeStatus, 'Code has expired — resend and try again.', 'error');
      return;
    }

    verifyBtn.disabled = true;

    if (mode === 'phone') {
      // Local check only — nothing was actually sent anywhere.
      if (entered === currentCode) {
        markVerified();
      } else {
        setStatus(codeStatus, 'Incorrect code.', 'error');
        verifyBtn.disabled = false;
      }
      return;
    }

    // Email is checked against the server, since that's the source of
    // truth for what was actually sent.
    setStatus(codeStatus, 'Verifying...', null);
    try {
      const res = await fetch('/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contact: currentContact, code: entered, token: currentToken })
      });
      const data = await res.json();
      if (data.success) {
        markVerified();
      } else {
        setStatus(codeStatus, data.error || 'Incorrect code.', 'error');
        verifyBtn.disabled = false;
      }
    } catch (err) {
      setStatus(codeStatus, 'Something went wrong.', 'error');
      verifyBtn.disabled = false;
    }
  }

  function markVerified() {
    setStatus(codeStatus, 'Verified.', 'success');
    codeInputs.forEach(i => i.disabled = true);
    verifyBtn.disabled = true;
    resendBtn.disabled = true;
    clearInterval(resendTimer);
  }

  verifyBtn.addEventListener('click', verifyCode);
})();

// --- DevTools deterrent ---
// This is a heuristic, not a real "DevTools is open" API — there isn't one.
// It combines two common signals (a docked panel changing the window's
// outer/inner size gap, and a timing delay caused by a `debugger` statement
// when breakpoints are active) and reacts if either trips. It will catch
// most people pressing F12 or right-click > Inspect, but a determined
// visitor can get around any client-side check like this.
(function () {
  // EDIT THIS to wherever you want visitors redirected:
  const REDIRECT_URL = 'https://example.com';

  let triggered = false;
  function trip() {
    if (triggered) return;
    triggered = true;
    window.close();
    window.location.replace(REDIRECT_URL);
  }

  const sizeThreshold = 160;
  setInterval(() => {
    const widthGap = window.outerWidth - window.innerWidth;
    const heightGap = window.outerHeight - window.innerHeight;
    if (widthGap > sizeThreshold || heightGap > sizeThreshold) {
      trip();
    }
  }, 500);

  setInterval(() => {
    const start = performance.now();
    // eslint-disable-next-line no-debugger
    debugger;
    const elapsed = performance.now() - start;
    if (elapsed > 100) {
      trip();
    }
  }, 800);
})();
</script>
