<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify your number</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #fafafa;
    --border: #e0e0e0;
    --text: #111111;
    --text-dim: #6b6b6b;
    --text-faint: #a3a3a3;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 360px;
  }

  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  p.sub {
    font-size: 14px;
    color: var(--text-dim);
    margin: 0 0 28px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  input[type="tel"] {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    font-family: inherit;
  }

  input[type="tel"]:focus {
    border-color: var(--text);
  }

  button.primary {
    width: 100%;
    background: var(--text);
    color: #ffffff;
    border: none;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 500;
    margin-top: 16px;
    cursor: pointer;
    font-family: inherit;
  }

  button.primary:disabled {
    background: var(--text-faint);
    cursor: default;
  }

  button.primary:hover:not(:disabled) {
    background: #333333;
  }

  .code-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .code-row input {
    width: 100%;
    aspect-ratio: 1 / 1;
    text-align: center;
    font-size: 19px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-family: inherit;
  }

  .code-row input:focus {
    border-color: var(--text);
  }

  .row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }

  .link-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
  }

  .link-btn:disabled {
    color: var(--text-faint);
    text-decoration: none;
    cursor: default;
  }

  .status {
    font-size: 13px;
    margin-top: 14px;
    min-height: 18px;
    color: var(--text-dim);
  }

  .status.error { color: var(--text); font-weight: 500; }
  .status.success { color: var(--text); font-weight: 500; }

  .screen { display: none; }
  .screen.active { display: block; }

  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
  }
</style>
</head>
<body>

<div class="card">

  <div class="screen active fade-in" id="screenPhone">
    <h1>Verify your number</h1>
    <p class="sub">We'll text you a 6-digit code.</p>
    <label for="phone">Phone number</label>
    <input type="tel" id="phone" placeholder="+1 555 010 1234" autocomplete="tel">
    <button class="primary" id="sendBtn">Send code</button>
    <div class="status" id="phoneStatus"></div>
  </div>

  <div class="screen" id="screenCode">
    <h1>Enter your code</h1>
    <p class="sub" id="sentTo">We sent a code to your phone.</p>
    <div class="code-row" id="codeRow">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
    </div>
    <button class="primary" id="verifyBtn">Verify</button>
    <div class="row-between">
      <button class="link-btn" id="resendBtn">Resend code</button>
      <button class="link-btn" id="backBtn">Change number</button>
    </div>
    <div class="status" id="codeStatus"></div>
  </div>

</div>

<script>
(function () {
  const screenPhone = document.getElementById('screenPhone');
  const screenCode = document.getElementById('screenCode');
  const phoneInput = document.getElementById('phone');
  const sendBtn = document.getElementById('sendBtn');
  const phoneStatus = document.getElementById('phoneStatus');
  const sentTo = document.getElementById('sentTo');
  const codeInputs = Array.from(document.querySelectorAll('#codeRow input'));
  const verifyBtn = document.getElementById('verifyBtn');
  const resendBtn = document.getElementById('resendBtn');
  const backBtn = document.getElementById('backBtn');
  const codeStatus = document.getElementById('codeStatus');

  let currentPhone = "";
  let currentToken = "";
  let resendCooldown = 0;
  let resendTimer = null;

  function showScreen(el) {
    [screenPhone, screenCode].forEach(s => s.classList.remove('active', 'fade-in'));
    el.classList.add('active', 'fade-in');
  }

  function setStatus(el, msg, kind) {
    el.textContent = msg;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  async function sendCode(isResend) {
    const phone = phoneInput.value.trim();
    if (!isResend) {
      if (!phone) {
        setStatus(phoneStatus, 'Enter a phone number.', 'error');
        return;
      }
      currentPhone = phone;
    }
    sendBtn.disabled = true;
    resendBtn.disabled = true;
    setStatus(phoneStatus, 'Sending...', null);
    setStatus(codeStatus, '', null);
    try {
      const res = await fetch('/api/send-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentPhone })
      });
      const data = await res.json();
      if (!res.ok || !data.token) {
        throw new Error(data.error || 'Could not send code.');
      }
      currentToken = data.token;
      sentTo.textContent = 'We sent a code to ' + currentPhone + '.';
      codeInputs.forEach(i => i.value = '');
      showScreen(screenCode);
      codeInputs[0].focus();
      setStatus(codeStatus, '', null);
      startResendCooldown();
    } catch (err) {
      setStatus(phoneStatus, err.message, 'error');
    } finally {
      sendBtn.disabled = false;
    }
  }

  function startResendCooldown() {
    resendCooldown = 30;
    resendBtn.disabled = true;
    updateResendLabel();
    clearInterval(resendTimer);
    resendTimer = setInterval(() => {
      resendCooldown--;
      if (resendCooldown <= 0) {
        clearInterval(resendTimer);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend code';
      } else {
        updateResendLabel();
      }
    }, 1000);
  }

  function updateResendLabel() {
    resendBtn.textContent = 'Resend code (' + resendCooldown + 's)';
  }

  sendBtn.addEventListener('click', () => sendCode(false));
  phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCode(false); });
  resendBtn.addEventListener('click', () => { if (!resendBtn.disabled) sendCode(true); });
  backBtn.addEventListener('click', () => {
    showScreen(screenPhone);
    setStatus(codeStatus, '', null);
  });

  codeInputs.forEach((input, idx) => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^0-9]/g, '').slice(0, 1);
      if (input.value && idx < codeInputs.length - 1) {
        codeInputs[idx + 1].focus();
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && idx > 0) {
        codeInputs[idx - 1].focus();
      }
      if (e.key === 'Enter') verifyCode();
    });
    input.addEventListener('paste', (e) => {
      const text = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '');
      if (text.length === codeInputs.length) {
        e.preventDefault();
        codeInputs.forEach((box, i) => box.value = text[i]);
        verifyBtn.focus();
      }
    });
  });

  async function verifyCode() {
    const code = codeInputs.map(i => i.value).join('');
    if (code.length !== 6) {
      setStatus(codeStatus, 'Enter all 6 digits.', 'error');
      return;
    }
    verifyBtn.disabled = true;
    setStatus(codeStatus, 'Verifying...', null);
    try {
      const res = await fetch('/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentPhone, code, token: currentToken })
      });
      const data = await res.json();
      if (data.success) {
        setStatus(codeStatus, 'Verified.', 'success');
        codeInputs.forEach(i => i.disabled = true);
        verifyBtn.disabled = true;
        resendBtn.disabled = true;
        clearInterval(resendTimer);
      } else {
        setStatus(codeStatus, data.error || 'Incorrect code.', 'error');
        verifyBtn.disabled = false;
      }
    } catch (err) {
      setStatus(codeStatus, 'Something went wrong.', 'error');
      verifyBtn.disabled = false;
    }
  }

  verifyBtn.addEventListener('click', verifyCode);
})();
</script>

</body>
</html>
